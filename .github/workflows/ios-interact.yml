name: ios-interact

on:
  workflow_dispatch:
    inputs:
      app_dir:
        description: "Carpeta del proyecto xtool (ci-clicker, ci-demo)"
        required: false
        default: "ci-clicker"
      acciones_file:
        description: "Archivo de acciones por defecto"
        required: false
        default: "scripts/ci/acciones-clicker.txt"
      acciones:
        description: "Acciones propias (una por linea). Si se rellena, tiene prioridad"
        required: false
        default: ""
      video:
        description: "Grabar video del simulador (true/false)"
        required: false
        default: "true"

jobs:
  interact:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          uname -m

      - name: Cache del build de xtool
        uses: actions/cache@v4
        with:
          path: .build
          key: xtool-macos26-${{ hashFiles('Package.resolved') }}

      - name: Build xtool (host macOS)
        run: swift build -c release --product xtool

      - name: Compilar la app para el simulador
        run: |
          set -euo pipefail
          cd "${{ inputs.app_dir }}"
          case "$(uname -m)" in
            arm64) T=arm64-apple-ios-simulator ;;
            *)     T=x86_64-apple-ios-simulator ;;
          esac
          echo "app=$(basename "$PWD") triple=$T"
          printf '' | ../.build/release/xtool dev build --triple "$T"
          find . -maxdepth 4 -name "*.app" -type d

      - name: Instalar idb (companion + cliente)
        run: |
          set -uo pipefail
          brew trust facebook/fb || brew trust --formula facebook/fb/idb facebook/fb/idb-cli facebook/fb/idb-companion || true
          # el release de idb-companion a veces devuelve 504 desde GitHub: reintentar
          for i in 1 2 3 4; do
            if brew install facebook/fb/idb; then break; fi
            echo "intento $i fallo; reintentando en 15s..."; sleep 15
          done
          command -v idb >/dev/null || { echo "idb no quedo instalado"; exit 1; }
          idb --help 2>&1 | head -5 || true

      - name: Arrancar simulador, instalar y lanzar la app
        id: sim
        run: |
          set -euo pipefail
          APP=$(find "${{ inputs.app_dir }}" -name "*.app" -type d | head -1)
          [ -n "$APP" ] || { echo "no se encontro el .app"; exit 1; }
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for v in d.values() for x in v if 'iPhone' in x['name']];c.sort(key=lambda x:x['name']);print(c[-1]['udid'])")
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          echo "simulador=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          BID=$(python3 -c "import plistlib;print(plistlib.load(open('$APP/Info.plist','rb'))['CFBundleIdentifier'])")
          echo "bundle_id=$BID"
          xcrun simctl launch "$UDID" "$BID"
          sleep 5
          xcrun simctl io "$UDID" screenshot 00-arranque.png
          ls -la 00-arranque.png

      # Grabacion y acciones en el MISMO paso: macOS no tiene setsid y un proceso
      # en segundo plano lanzado en otro paso puede no sobrevivir entre pasos.
      - name: Ejecutar acciones con capturas (y grabar video)
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -uo pipefail
          RC=0
          ACCIONES="${{ inputs.acciones_file }}"
          if [ -n "${{ inputs.acciones }}" ]; then
            printf '%s\n' "${{ inputs.acciones }}" > acciones-usuario.txt
            ACCIONES="acciones-usuario.txt"
          fi
          echo "--- acciones ($ACCIONES) ---"; cat "$ACCIONES"

          REC=""
          if [ "${{ inputs.video }}" != "false" ]; then
            nohup xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 video.mp4 \
              >/tmp/record.log 2>&1 </dev/null &
            REC=$!
            sleep 3
            echo "grabando con pid $REC"
          fi

          bash scripts/ci/idb-actions.sh "$ACCIONES" capturas || RC=$?
          cp "$ACCIONES" capturas/acciones-usadas.txt 2>/dev/null || true

          if [ -n "$REC" ]; then
            kill -INT "$REC" 2>/dev/null || true
            for _ in $(seq 1 20); do kill -0 "$REC" 2>/dev/null || break; sleep 1; done
            kill -9 "$REC" 2>/dev/null || true
            ls -la video.mp4 2>/dev/null || echo "sin video"
            tail -3 /tmp/record.log 2>/dev/null || true
          fi
          exit "$RC"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-interaccion
          path: |
            00-arranque.png
            video.mp4
            capturas/**
          if-no-files-found: warn
